services:
  postgres:
    image: postgres:16
    container_name: library-mngt
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin!!
      POSTGRES_DB: libranet
    ports:
      - "5434:5432"
    volumes:
      - libranet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d libranet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  libranet-postgres:
