services:
  postgres:
    image: postgres:16
    container_name: ceesharp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ceesharp
      POSTGRES_PASSWORD: ceesharp
      POSTGRES_DB: ceesharp
    ports:
      - "5434:5432"
    volumes:
      - ceesharp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceesharp -d ceesharp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ceesharp-postgres:
